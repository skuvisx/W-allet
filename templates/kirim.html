{% extends "base.html" %}
{% block judul %}Kirim Saldo{% endblock %}
{% block lebar %}sempit{% endblock %}

{% block isi %}
<div class="kartu">
  <h1>Kirim Saldo</h1>
  <p class="kecil">Saldo sekarang: {{ user.saldo|rupiah }}</p>

  <form action="/kirim" method="post" id="form-kirim">
    <label for="no_hp">Nomor HP penerima</label>
    <input id="no_hp" name="no_hp" placeholder="08xxxxxxxxxx" maxlength="15" inputmode="numeric" required>
    <div class="kecil" id="info-penerima" aria-live="polite"></div>

    <label for="nominal">Nominal (Rp)</label>
    <input type="number" id="nominal" name="nominal" min="{{ batas[0] }}" max="{{ batas[1] }}" required>
    <div class="kecil">Minimal {{ batas[0]|rupiah }}, maksimal {{ batas[1]|rupiah }}. Tanpa biaya admin.</div>

    <label for="catatan">Catatan (boleh kosong)</label>
    <input id="catatan" name="catatan" maxlength="100">

    <div class="tombol-form">
      <button class="tombol">Kirim</button>
      <a class="tombol abu" href="/">Batal</a>
    </div>
  </form>
</div>

<script>
  // Tampilkan nama pemilik nomor HP supaya pengguna yakin tidak salah kirim.
  const kolomHp = document.getElementById("no_hp");
  const info = document.getElementById("info-penerima");
  let namaPenerima = "";
  kolomHp.addEventListener("change", async () => {
    namaPenerima = "";
    info.textContent = "";
    info.className = "kecil";
    const nomor = kolomHp.value.trim();
    if (!nomor) return;
    try {
      const jawab = await fetch("/kirim/cek?no_hp=" + encodeURIComponent(nomor));
      const data = await jawab.json();
      info.textContent = data.teks;
      info.className = "kecil " + (data.ada ? "hijau" : "merah");
      if (data.ada) namaPenerima = data.teks.replace("Penerima: ", "");
    } catch (e) { /* koneksi gagal: biarkan, server tetap memeriksa saat dikirim */ }
  });
  document.getElementById("form-kirim").addEventListener("submit", (e) => {
    const nominal = Number(document.getElementById("nominal").value).toLocaleString("id-ID");
    const tujuan = namaPenerima || kolomHp.value;
    if (!confirm("Kirim Rp " + nominal + " ke " + tujuan + "?")) e.preventDefault();
  });
</script>
{% endblock %}
