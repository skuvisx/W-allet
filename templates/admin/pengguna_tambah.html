{% extends "base.html" %}
{% block judul %}Tambah Pengguna{% endblock %}
{% block lebar %}sempit{% endblock %}

{% block isi %}
<div class="kartu">
  <h1>Tambah Pengguna</h1>

  <form action="/admin/pengguna/tambah" method="post">
    <label for="nama">Nama lengkap</label>
    <input id="nama" name="nama" minlength="3" maxlength="100" required autofocus>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" maxlength="100" required>

    <label for="no_hp">Nomor HP</label>
    <input id="no_hp" name="no_hp" placeholder="08xxxxxxxxxx" maxlength="15" pattern="08[0-9]{8,13}" required>

    <label for="role">Peran</label>
    <select id="role" name="role">
      <option value="pengguna">Pengguna (punya saldo, bisa bertransaksi)</option>
      <option value="admin">Admin (mengelola data master dan laporan)</option>
    </select>

    <label for="password">Password awal</label>
    <input type="password" id="password" name="password" minlength="6" maxlength="50" required>

    <label for="ulangi">Ulangi password</label>
    <input type="password" id="ulangi" name="ulangi" minlength="6" maxlength="50" required>

    <div class="tombol-form">
      <button class="tombol">Simpan</button>
      <a class="tombol abu" href="/admin/pengguna">Batal</a>
    </div>
  </form>
</div>
{% endblock %}
