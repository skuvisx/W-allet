{% extends "base.html" %}
{% block judul %}{{ "Edit" if item else "Tambah" }} Layanan{% endblock %}
{% block lebar %}sempit{% endblock %}

{% block isi %}
<div class="kartu">
  <h1>{{ "Edit" if item else "Tambah" }} Layanan</h1>

  <form action="{{ '/admin/layanan/%d/edit' % item.id if item else '/admin/layanan/tambah' }}" method="post">
    <label for="nama_layanan">Nama layanan</label>
    <input id="nama_layanan" name="nama_layanan" value="{{ item.nama_layanan if item }}" maxlength="100" required autofocus>

    <label for="kategori_id">Kategori</label>
    <select id="kategori_id" name="kategori_id" required>
      {% for k in kategori %}
        <option value="{{ k.id }}" {% if item and item.kategori_id == k.id %}selected{% endif %}>{{ k.nama_kategori }}</option>
      {% endfor %}
    </select>

    <label for="biaya_admin">Biaya admin (Rp)</label>
    <input type="number" id="biaya_admin" name="biaya_admin" value="{{ item.biaya_admin|int if item else 0 }}" min="0" max="100000" required>

    {% if item %}
    <label class="centang">
      <input type="checkbox" name="aktif" {% if item.aktif %}checked{% endif %}>
      Aktif (bisa dipilih pengguna saat membayar)
    </label>
    {% endif %}

    <div class="tombol-form">
      <button class="tombol">Simpan</button>
      <a class="tombol abu" href="/admin/layanan">Batal</a>
    </div>
  </form>
</div>
{% endblock %}
